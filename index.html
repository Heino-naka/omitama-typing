<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小美玉市タイピング探検</title>
<meta name="description" content="小美玉市のことばを打って遊ぶ無料タイピングゲーム。町域・茨城空港・牧場・花火など190枚のふるさとカードを、ガチャで集めよう。パソコン・Chromebook向け、登録不要。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://heino-naka.github.io/omitama-typing/">
<meta property="og:image" content="https://heino-naka.github.io/omitama-typing/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta property="og:title" content="空とミルクの市 小美玉市タイピング探検">
<meta property="og:description" content="小美玉市のことばを打って、ふるさとカードを集めよう。小美玉市のこどもたちのための無料タイピングゲームです。">
<meta property="og:site_name" content="小美玉市タイピング探検">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:image" content="https://heino-naka.github.io/omitama-typing/ogp.png">
<link rel="canonical" href="https://heino-naka.github.io/omitama-typing/">
<meta name="theme-color" content="#5fb3ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235fb3ea'/%3E%3Cpath d='M30 34h40l6 14v34q0 8-8 8H32q-8 0-8-8V48z' fill='%23fff' stroke='%233a2e4f' stroke-width='4'/%3E%3Cpath d='M34 34q0-10 16-10t16 10z' fill='%23d6dbe6' stroke='%233a2e4f' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#2b2140; --ink2:#5a4d6e; --sun:#ff8a3d; --sun2:#ffb36b; --lake:#2f6f8f; --lake2:#1f4f68;
  --paper:#fff8ee; --paper2:#f3e7d6; --gold:#f2b134; --ok:#2e9e6a; --ng:#e0485a; --sky1:#2b2140; --sky2:#7a4a7e;
  --r1:#5b9bd5; --r2:#9b6fd0; --r3:#f2b134;
  --font:"BIZ UDPGothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans CJK JP","Noto Sans JP",sans-serif;
  --mono:"Consolas","Menlo","Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font);font-size:clamp(15px,.9vw + 6px,19px);color:var(--ink);overflow-x:hidden;-webkit-tap-highlight-color:transparent;min-height:100vh;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 38%,#e9845a 58%,var(--lake) 58.2%,var(--lake2) 100%);background-attachment:fixed}
.sun{position:fixed;left:50%;top:44vh;width:30vmin;height:30vmin;margin-left:-15vmin;border-radius:50%;
  background:radial-gradient(circle,#ffd08a 0%,var(--sun) 60%,rgba(255,138,61,0) 72%);z-index:0;pointer-events:none}
.ripple{position:fixed;left:0;right:0;top:58vh;height:42vh;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,179,107,.0) 0 14px,rgba(255,179,107,.18) 14px 16px);
  -webkit-mask:linear-gradient(90deg,transparent 30%,#000 45%,#000 55%,transparent 70%);mask:linear-gradient(90deg,transparent 30%,#000 45%,#000 55%,transparent 70%)}
main{position:relative;z-index:1;width:100%;max-width:1180px;margin:0 auto;padding:clamp(10px,2.2vh,26px) clamp(14px,3vw,40px) clamp(14px,3vh,30px);
  min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.screen{display:none;width:100%}
.screen.on{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel{background:var(--paper);border-radius:22px;padding:clamp(14px,2.2vw,28px);box-shadow:0 8px 0 rgba(0,0,0,.18),0 18px 40px rgba(0,0,0,.25)}
h2{font-size:clamp(20px,2vw,26px);margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.center{text-align:center}
.coins{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 16px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.12)}
button{font-family:inherit;cursor:pointer;border:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:clamp(16px,1.5vw,20px);font-weight:700;padding:12px 18px;border-radius:14px;
  background:var(--sun);color:#fff;box-shadow:0 4px 0 #c8602a;transition:transform .05s;min-height:50px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c8602a}
.btn.sub2{background:#fff;color:var(--ink);box-shadow:0 4px 0 #c9bba8}
.btn.blue{background:var(--lake);box-shadow:0 4px 0 #1b4559}
.btn.small{min-height:42px;padding:6px 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#qrBox{position:fixed;top:12px;left:12px;z-index:5;background:#fff;border-radius:12px;padding:6px 6px 4px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.18);width:clamp(84px,9vw,124px)}
#qrBox img{display:block;width:100%;height:auto;image-rendering:pixelated}
#qrBox span{display:block;font-size:11px;font-weight:700;color:var(--ink);line-height:1.5}
.btn.danger{background:#ef6a5a;color:#fff;box-shadow:0 4px 0 #b84a3d}
.foot{text-align:center;color:#ffe6cc;font-size:clamp(12px,1.1vw,15px);margin-top:clamp(12px,2.4vh,24px);line-height:1.8}
.foot a{color:#fff}
/* ---- タイトル（よこ ながは ひだり：なまえ／みぎ：メニュー） ---- */
.hero{display:grid;gap:clamp(12px,2.5vh,22px);align-items:center}
.hero h1{color:#fff;text-align:center;font-size:clamp(34px,8vw,60px);line-height:1.25;letter-spacing:.04em;text-shadow:0 3px 0 rgba(0,0,0,.28);text-wrap:balance}
.hero h1 small{display:block;font-size:.42em;letter-spacing:.3em;color:var(--sun2);margin-bottom:.35em}
.hero .sub{color:#ffe6cc;text-align:center;font-size:clamp(15px,1.7vw,22px);line-height:1.8;margin-top:12px;font-weight:700;text-wrap:balance}
.btn.big{width:100%;min-height:clamp(70px,12vh,104px);font-size:clamp(22px,2.4vw,32px);letter-spacing:.06em;margin:clamp(12px,2.4vh,22px) 0;
  background:linear-gradient(180deg,#ffa24d,#ff7a1f);box-shadow:0 6px 0 #c45a12,0 14px 28px rgba(0,0,0,.22);animation:pulse 2.4s ease-in-out infinite}
.btn.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c45a12;animation:none}
@keyframes pulse{50%{transform:scale(1.025)}}
/* ---- コース えらび ---- */
.scrTitle{color:#fff;text-align:center;font-size:clamp(26px,3.6vw,44px);text-shadow:0 3px 0 rgba(0,0,0,.28);margin-bottom:clamp(10px,2.4vh,22px);letter-spacing:.08em}
.courseRow{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:clamp(12px,2.4vh,22px)}
.ctile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:120px;padding:16px;border-radius:24px;color:#fff;text-align:center;
  border:4px solid rgba(255,255,255,.6);text-shadow:0 2px 0 rgba(0,0,0,.28);box-shadow:0 8px 0 rgba(0,0,0,.28),0 18px 40px rgba(0,0,0,.3);transition:transform .08s}
.ctile:hover{transform:translateY(-4px)}
.ctile:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.ctile .ic{font-size:clamp(48px,9vh,88px);line-height:1}
.ctile b{font-size:clamp(28px,3.4vw,46px);letter-spacing:.08em}
.ctile .d{font-size:clamp(14px,1.55vw,20px);font-weight:700;line-height:1.5}
.ctile .hs{background:rgba(0,0,0,.3);border-radius:999px;padding:5px 18px;font-size:clamp(13px,1.3vw,17px);text-shadow:none}
.ctile .hs strong{font-size:1.5em;font-family:var(--mono);margin-left:.3em}
.ctile .key{position:absolute;top:12px;left:14px;background:rgba(255,255,255,.9);color:var(--ink);border-radius:8px;padding:0 10px;font-size:14px;font-weight:700;text-shadow:none}
.ctile.c1{background:linear-gradient(160deg,#3fc886,#1c8a58)}
.ctile.c2{background:linear-gradient(160deg,#ffa24d,#e0621a)}
.ctile.c3{background:linear-gradient(160deg,#b680e6,#7338ad)}
.ctile.locked{background:linear-gradient(160deg,#625c7a,#403a54);border-color:rgba(255,255,255,.28);cursor:default}
.ctile.locked:hover,.ctile.locked:active{transform:none}
.ctile.locked .ic{opacity:.85}
/* ---- ゲーム ---- */
.hud{display:flex;gap:14px;align-items:center;margin-bottom:clamp(8px,1.6vh,16px);color:#fff;font-weight:700}
.tleft{font-family:var(--mono);font-size:clamp(26px,3vw,42px);min-width:2.2em;text-align:right}
.timebar{flex:1;height:clamp(14px,2.4vh,22px);border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--sun),var(--gold));border-radius:999px}
.hud .sc{font-family:var(--mono);font-size:clamp(28px,3.4vw,48px);margin-left:auto;min-width:3.2em;text-align:right}
.stage{display:grid;grid-template-columns:1fr;gap:12px;align-items:center;position:relative;cursor:text;text-align:center;
  min-height:clamp(300px,58vh,520px);padding:clamp(20px,3vh,36px) clamp(14px,2.4vw,36px);align-content:center;justify-items:center}
.stL,.stR{width:100%}
.wic{font-size:clamp(48px,11vh,100px);line-height:1.1}
.wkanji{font-weight:700;line-height:1.25;word-break:break-all;margin:6px 0 4px}
.wkana{color:var(--ink2);font-size:clamp(18px,2.4vw,30px);word-break:break-all;letter-spacing:.06em}
.wkana .d{color:#c9b9a3}
.roma{font-family:var(--mono);font-weight:700;letter-spacing:.04em;word-break:break-all;line-height:1.3;min-height:1.4em}
.roma .t{color:var(--ok)}
.roma .n{background:var(--gold);color:var(--ink);border-radius:6px;padding:0 3px}
.roma .r{color:#a99a87}
.nextkey{margin:clamp(10px,2.4vh,26px) auto 4px;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--ink2);font-size:clamp(14px,1.6vw,20px);font-weight:700}
.cap{display:inline-flex;align-items:center;justify-content:center;min-width:clamp(64px,9vh,92px);height:clamp(64px,9vh,92px);padding:0 12px;border-radius:14px;background:#fff;border:3px solid #d8cbb8;
  box-shadow:0 5px 0 #d8cbb8;font-family:var(--mono);font-size:clamp(34px,5.4vh,52px);font-weight:700;color:var(--ink);text-transform:uppercase}
.combo{position:absolute;right:18px;top:12px;font-weight:700;color:var(--sun);font-size:clamp(15px,1.6vw,20px)}
.combo.big{font-size:clamp(20px,2.2vw,28px)}
.flash{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:clamp(22px,3vw,34px);font-weight:700;color:var(--ok);pointer-events:none;opacity:0}
.flash.go{animation:pop .7s ease}
@keyframes pop{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:translateY(-30px)}}
.shake{animation:shake .18s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.warn{display:none;margin-top:10px;background:#ffe3e3;color:#9b1c2c;border-radius:10px;padding:8px 10px;font-size:15px;font-weight:700}
.warn.on{display:block}
.taphint{margin-top:10px;font-size:13px;color:var(--ink2);display:none}
.touch .taphint{display:block}
#hid{position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;z-index:-1;color:transparent;caret-color:transparent;background:transparent;pointer-events:none}
/* ---- カウントダウン（くらい はいけい ＋ おおきな まるい バッジ） ---- */
.count{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,30px);background:rgba(20,12,35,.88);z-index:40}
.count.on{display:flex}
.cnum{display:flex;align-items:center;justify-content:center;width:min(46vh,62vw);aspect-ratio:1;border-radius:50%;background:#fff;color:var(--sun);font-family:var(--mono);font-weight:700;
  font-size:min(28vh,36vw);line-height:1;border:clamp(8px,1.6vh,16px) solid var(--gold);box-shadow:0 0 0 clamp(8px,2vh,20px) rgba(255,255,255,.2),0 20px 50px rgba(0,0,0,.5)}
.cnum.go{background:var(--sun);color:#fff;font-size:min(8.5vh,11vw);letter-spacing:.06em;border-color:#fff;font-family:var(--font)}
.cnum.pop{animation:cpop .5s ease-out}
@keyframes cpop{0%{transform:scale(.55);opacity:.2}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.cmsg{color:#fff;font-weight:700;font-size:clamp(18px,2.6vw,30px);text-align:center;line-height:1.7;padding:0 16px}
.cmsg small{display:block;color:var(--sun2);font-size:.78em}
/* ---- けっか ---- */
.resGrid{display:grid;gap:14px}
.bigscore{font-size:clamp(52px,9vh,84px);font-weight:700;font-family:var(--mono);text-align:center;line-height:1.1}
.titlebox{margin:14px 0;padding:14px;border-radius:16px;background:linear-gradient(135deg,#fff3dd,#ffe1bf);text-align:center;border:2px solid var(--gold)}
.titlebox .lab{font-size:13px;color:var(--ink2)}
.titlebox .ttl{font-size:clamp(24px,2.6vw,34px);font-weight:700;margin:4px 0}
.titlebox .nx{font-size:clamp(13px,1.3vw,16px);color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.stats div{background:#fff;border-radius:12px;padding:10px 6px;text-align:center;font-size:clamp(12px,1.2vw,15px);color:var(--ink2)}
.stats b{display:block;font-size:clamp(22px,2.4vw,32px);color:var(--ink);font-family:var(--mono)}
.bridge{margin:14px 0;padding:14px;border-radius:14px;background:var(--lake);color:#fff;font-weight:700;line-height:1.7;text-align:center;font-size:clamp(15px,1.6vw,20px)}
.newbest{color:var(--ng);font-weight:700;text-align:center;font-size:clamp(16px,1.8vw,22px);min-height:1.4em}
.unlock{background:#e6f6ee;color:#1d6b47;border-radius:12px;padding:10px;font-weight:700;text-align:center;margin:10px 0}
/* ---- ガチャ ---- */
.gGrid{display:grid;gap:14px;margin:10px 0 14px}
.machine{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.capsule{width:clamp(96px,17vh,150px);height:clamp(96px,17vh,150px);border-radius:50%;position:relative;overflow:hidden;box-shadow:inset -10px -10px 0 rgba(0,0,0,.12),0 8px 0 rgba(0,0,0,.15)}
.capsule:before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:rgba(255,255,255,.85)}
.capsule:after{content:"";position:absolute;left:0;right:0;top:calc(50% - 3px);height:6px;background:rgba(0,0,0,.15)}
.capsule.spin{animation:wobble .25s infinite}
@keyframes wobble{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.capsule.open{animation:openit .4s forwards}
@keyframes openit{to{transform:scale(1.4);opacity:0}}
.gR{min-height:120px}
.gR:empty::before{content:"ここに カードが でるよ";display:flex;align-items:center;justify-content:center;min-height:200px;border:3px dashed #d8cbb8;border-radius:16px;color:#a99a87;font-weight:700}
/* ---- カード ---- */
.card{border-radius:16px;padding:14px;background:#fff;border:4px solid var(--r1);text-align:center;position:relative}
.card.r2{border-color:var(--r2)}
.card.r3{border-color:var(--r3);background:linear-gradient(135deg,#fffdf5,#fff1c9)}
.card .stars{font-size:16px;color:var(--gold);letter-spacing:2px}
.card .cic{font-size:clamp(46px,8vh,64px);line-height:1.2;margin:4px 0}
.card .cn{font-size:clamp(20px,2.2vw,28px);font-weight:700}
.card .ck{font-size:clamp(12px,1.2vw,15px);color:var(--ink2);margin-bottom:8px}
.card .cf rt{font-size:.55em;color:var(--ink2)}
.card .cf{font-size:clamp(15px,1.5vw,19px);line-height:2;text-align:left;background:var(--paper);border-radius:10px;padding:10px 14px}
.badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--ng);color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:3px 12px}
.reveal{animation:reveal .45s ease}
@keyframes reveal{from{transform:rotateY(90deg) scale(.8)}to{transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(96px,10vw,140px),1fr));gap:8px}
.mini{border-radius:12px;background:#fff;border:3px solid var(--r1);padding:8px 4px;text-align:center;min-height:96px;font-family:inherit;color:var(--ink)}
.mini.r2{border-color:var(--r2)} .mini.r3{border-color:var(--r3)}
.mini .mi{font-size:30px}
.mini .mn{font-size:12px;font-weight:700;line-height:1.3;word-break:break-all}
.mini.no{background:#e6ddd0;border-color:#cbbfae;color:#9a8c7a}
.prog{height:12px;border-radius:999px;background:#e6ddd0;overflow:hidden;margin:8px 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--r1),var(--r2),var(--r3))}
.zkh{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;margin:16px 0 8px}
.zkh span{font-size:14px;color:var(--ink2);font-family:var(--mono)}
.zkh:first-child{margin-top:0}
/* ---- モーダル ---- */
.modal{position:fixed;inset:0;background:rgba(20,12,35,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.modal .panel{max-width:560px;width:100%;max-height:92vh;overflow:auto}
.howto li{margin:0 0 10px 1.3em;line-height:1.7}
kbd{font-family:var(--mono);background:#fff;border:1px solid #cdbfab;border-bottom-width:3px;border-radius:6px;padding:0 6px}
/* ---- しょうしょ ---- */
.cert{background:#fffdf7;border:10px double var(--gold);border-radius:8px;padding:26px 20px;text-align:center;line-height:1.9}
.cert h3{font-size:34px;letter-spacing:.12em;margin-bottom:8px}
.cert .nm{font-size:26px;font-weight:700;border-bottom:2px solid var(--ink);display:inline-block;min-width:60%;margin:8px 0 14px}
.cert .dt{margin-top:14px;font-size:14px}
.nameinput{font-family:inherit;font-size:18px;padding:10px;border-radius:10px;border:2px solid #d8cbb8;width:100%;margin:10px 0}
@media print{body{background:#fff}.sun,.ripple,.noprint{display:none!important}.screen{display:none!important}#cert.screen{display:block!important}.panel{box-shadow:none}}
/* ---- よこ ながの がめん（Chromebook など） ---- */
@media (min-aspect-ratio:5/4) and (min-width:760px){
  .hero{grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,56px)}
  .hero h1,.hero .sub{text-align:left}
  .hero h1{font-size:clamp(30px,3.3vw,50px)}
  .courseRow{grid-template-columns:repeat(3,1fr);gap:clamp(14px,2.2vw,32px)}
  .ctile{min-height:clamp(240px,50vh,390px)}
  .resGrid{grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,40px);align-items:center}
  .gGrid{grid-template-columns:.8fr 1.2fr;gap:clamp(18px,3vw,40px);align-items:start}
}
.mini.back{background:linear-gradient(160deg,#7a6a9a,#4a3d6a);border-color:#3b2f58;color:#fff}
.mini .nw{font-size:12px;color:var(--ng);font-weight:700}
.mini.flip{animation:flipin .4s ease}
@keyframes flipin{0%{transform:rotateY(90deg) scale(.7)}100%{transform:none}}
.mini.isnew{box-shadow:0 0 0 3px rgba(242,177,52,.55)}
.mini.isnew .nw{animation:blink .7s infinite alternate}
@keyframes blink{to{opacity:.35}}
.mini.shine{animation:flipin .4s ease,shine 1s ease-in-out 3 .4s;box-shadow:0 0 18px 6px rgba(242,177,52,.9)}
@keyframes shine{50%{transform:scale(1.12);box-shadow:0 0 28px 12px rgba(255,235,150,1)}}
.bigbanner{background:linear-gradient(90deg,var(--ng),var(--sun),var(--gold));color:#fff;text-align:center;font-weight:700;font-size:clamp(20px,2.4vw,30px);border-radius:14px;padding:8px;margin-bottom:8px;animation:bpop .6s ease}
@keyframes bpop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.burst{position:fixed;inset:0;z-index:60;background:radial-gradient(circle,rgba(70,40,110,.9),rgba(15,8,30,.96));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;cursor:pointer}
.burst i{position:absolute;top:-20px;width:10px;height:16px;animation:fall 2.4s linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.burst .bt{color:var(--gold);font-weight:700;font-size:clamp(28px,5vw,52px);text-shadow:0 3px 0 rgba(0,0,0,.4);animation:bpop .6s ease}
.burst .bc{width:min(92vw,520px);max-height:62vh;overflow:auto;border-radius:18px}
.burst .bh{color:#fff;opacity:.8;font-size:14px}
.ico{display:block;width:1em;height:1em;margin:0 auto;overflow:visible}
.wic{font-size:clamp(70px,16vh,130px)}
.card .cic{font-size:clamp(70px,13vh,96px)}
.mini .mi{font-size:46px;line-height:1}
.mini.back .mi{font-size:34px;line-height:46px}
.bi{display:inline-block;width:1.4em;height:1.4em;vertical-align:middle}
.bi .ico{width:100%;height:100%}
.emo{font-size:.8em}
.sj{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em}
.accbox{margin:10px 0;border-radius:16px;padding:10px 12px;text-align:center;color:#fff;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.accbox .an{font-size:clamp(22px,2.6vw,32px)}
.accbox .ap{font-size:clamp(14px,1.5vw,18px)}
.accbox .ap b{font-size:1.5em;font-family:var(--mono)}
.accbox.t1{background:linear-gradient(90deg,#3fc886,#1c8a58)}
.accbox.t2{background:linear-gradient(90deg,#5b9bd5,#2f6f8f)}
.accbox.t3{background:linear-gradient(90deg,#b680e6,#7338ad);animation:glowp 1.2s ease-in-out infinite alternate}
.accbox.t4{background:linear-gradient(90deg,#ef6a5a,#ff9a3d,#f2b134,#6cc07a,#5b9bd5,#9b6fd0);background-size:200% 100%;animation:rb 2s linear infinite;border:3px solid #fff}
@keyframes rb{to{background-position:200% 0}}
@keyframes glowp{to{box-shadow:0 0 18px 6px rgba(182,128,230,.8)}}
.accnote{text-align:center;font-size:13px;color:var(--ink2);margin:8px 0}
.accfx{position:fixed;inset:0;z-index:70;pointer-events:auto;overflow:hidden}
.accfx i{position:absolute;top:-20px;width:10px;height:16px;animation:fall 2.4s linear infinite}
.accfx .abanner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);white-space:nowrap;color:#fff;font-weight:700;font-size:clamp(34px,7vw,84px);text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 24px rgba(255,200,80,.9);animation:bpop .7s ease}
.accfx.l1 .abanner{font-size:clamp(28px,5vw,56px)}
.accfx.l4{background:radial-gradient(circle,rgba(255,220,120,.35),rgba(30,10,60,.7))}
.accfx.l3{background:radial-gradient(circle,rgba(180,128,230,.3),rgba(30,10,60,.55))}
.accfx.l4 .abanner{font-size:clamp(36px,8vw,96px);background:linear-gradient(90deg,#ff6a5a,#ffd35c,#6cc07a,#5b9bd5,#b680e6);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}
.aflash{position:absolute;inset:0;background:#fff;opacity:0;animation:fl .7s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.ctile .ic .ico{width:1.5em;height:1.5em}
/* ===== 小美玉市版：色と景色の上書き ===== */
:root{--sky1:#5fb3ea;--sky2:#b4e0f7;--lake:#3a8fc0;--lake2:#245f86;--gold:#f4b52e;--sun:#f08a2a;--sun2:#ffbf7a}
body{background:linear-gradient(180deg,#5fb3ea 0%,#9fd6f4 40%,#e4f5ff 62%,#a8d672 62.2%,#6fa84a 100%);background-attachment:fixed}
.sun{left:auto;right:7vw;top:7vh;width:16vmin;height:16vmin;margin-left:0;background:radial-gradient(circle,#fffbe0 0%,#ffe27a 55%,rgba(255,226,122,0) 72%)}
.ripple{display:none}
.scene{position:fixed;left:0;right:0;bottom:0;height:46vh;z-index:0;pointer-events:none}
.scene svg{display:block;width:100%;height:100%}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.hero h1{color:#24304f;text-shadow:0 3px 0 rgba(255,255,255,.75)}
.hero h1 small{color:#d4651a;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.hero .sub{color:#1f4f68;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.scrTitle{color:#24304f;text-shadow:0 2px 0 rgba(255,255,255,.75)}
.hud{color:#24304f}
.timebar{background:rgba(36,48,79,.18)}
.foot{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.foot a{color:#fff}
.count{background:rgba(20,40,70,.86)}
.cmsg small{color:#ffd9a0}
.burst{background:radial-gradient(circle,rgba(40,70,120,.92),rgba(10,16,40,.97))}
.burst .bt{color:#ffd35c}
.accfx.l4{background:radial-gradient(circle,rgba(255,225,140,.28),rgba(10,24,60,.72))}
.accfx.l3{background:radial-gradient(circle,rgba(140,190,255,.25),rgba(10,24,60,.6))}
.fxhost{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fwcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.burst>.bt,.burst>.bc,.burst>.bh,.accfx>.abanner{position:relative;z-index:2}
.accfx>.abanner{position:absolute}
.plane{position:absolute;left:0;width:clamp(70px,11vw,150px);height:clamp(70px,11vw,150px);animation:fly 6s linear forwards;transform:translateX(-30vw);will-change:transform;z-index:1}
.plane .ico{width:100%;height:100%}
.plane .trail{position:absolute;right:88%;top:48%;width:38vw;height:.55vw;min-height:5px;margin-top:-.28vw;border-radius:99px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95))}
@keyframes fly{from{transform:translateX(-30vw)}to{transform:translateX(125vw)}}
#sky .plane{opacity:.95}
@media (prefers-reduced-motion:reduce){.plane{display:none}.btn.big{animation:none}}
.ctile .ic .ico{width:1.5em;height:1.5em}
.foot{display:table;margin-left:auto;margin-right:auto;background:rgba(36,48,79,.6);border-radius:12px;padding:6px 14px}

/* ---- ひだりは ひる、みぎは よる ---- */
.sun{left:16vw;right:auto;top:8vh;width:17vmin;height:17vmin}
#night{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,150,80,0) 0%,rgba(255,150,80,0) 28%,rgba(255,128,92,.30) 46%,rgba(92,56,140,.58) 62%,rgba(30,34,96,.80) 80%,rgba(12,18,62,.90) 100%)}
.scene2{position:fixed;left:0;right:0;bottom:0;height:46vh;z-index:0;pointer-events:none}
.scene2 svg{display:block;width:100%;height:100%}
.moon{position:fixed;right:9vw;top:7vh;width:11vmin;height:11vmin;border-radius:50%;z-index:1;pointer-events:none;
  background:radial-gradient(circle at 38% 34%,#fffef0,#f6efc0 70%);box-shadow:0 0 5vmin 1.4vmin rgba(255,250,200,.45)}
.stars{position:fixed;top:0;right:0;width:52vw;height:50vh;z-index:1;pointer-events:none;opacity:.95;
  background-image:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(2px 2px at 30% 8%,#fff,transparent),radial-gradient(1.6px 1.6px at 44% 28%,#fff,transparent),
  radial-gradient(2px 2px at 58% 14%,#fff,transparent),radial-gradient(1.6px 1.6px at 72% 30%,#fff,transparent),radial-gradient(2px 2px at 86% 22%,#fff,transparent),
  radial-gradient(1.6px 1.6px at 22% 36%,#fff,transparent),radial-gradient(2px 2px at 66% 6%,#fff,transparent),radial-gradient(1.6px 1.6px at 92% 40%,#fff,transparent),radial-gradient(1.6px 1.6px at 50% 40%,#fff,transparent);
  -webkit-mask:linear-gradient(90deg,transparent 0%,#000 55%);mask:linear-gradient(90deg,transparent 0%,#000 55%);animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.stars{animation:none}}

.hud .tleft{color:#24304f;text-shadow:0 2px 0 rgba(255,255,255,.7)}

function toHira(s){return s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))}
function makeUnits(kana){
  const s=toHira(kana).replace(/[・\s]/g,''); const u=[];
  for(let i=0;i<s.length;i++){
    const two=s.substr(i,2);
    if(two.length===2&&T[two]&&'ぁぃぅぇぉゃゅょ'.includes(two[1])){u.push({k:two,c:T[two].slice()});i++;continue}
    if(s[i]==='っ'||s[i]==='ん'){u.push({k:s[i],c:[]});continue}
    if(/[0-9?？]/.test(s[i])){const d=s[i]==='？'?'?':s[i];u.push({k:s[i],c:[d],up:true});continue} // 数字と ？（？は Shift+/）
    if(/[A-Z]/.test(s[i])){u.push({k:s[i],c:[s[i]],up:true});continue} // 大もじ＝Shiftを おして うつ
    if(!T[s[i]]) throw new Error('ローマ字がない文字: '+s[i]+' in '+kana);
    u.push({k:s[i],c:T[s[i]].slice()});
  }
  for(let i=u.length-1;i>=0;i--){ // うしろから きめる（つぎの もじを みるため）
    const nx=u[i+1];
    if(u[i].k==='っ'){
      const set=[]; if(nx) for(const c of nx.c){const f=c[0]; if(!'aiueon-'.includes(f)&&!set.includes(f)) set.push(f)}
      u[i].c=[...set,'ltu','xtu','ltsu'];
    }else if(u[i].k==='ん'){
      const single = nx && nx.c.every(c=>!'aiueoyn'.includes(c[0]));
      u[i].c = single?['nn','n','xn']:['nn','xn'];
    }
  }
  return u;
}
function makeMatcher(kana){return {u:makeUnits(kana),i:0,buf:''}}
function press(m,k){
  const u=m.u[m.i]; if(!u) return false;
  if(!u.up) k=k.toLowerCase();
  const nb=m.buf+k, ms=u.c.filter(c=>c.startsWith(nb));
  if(ms.length){
    m.buf=nb; u.ch=ms[0];
    if(ms.includes(nb)&&!ms.some(c=>c.length>nb.length)){u.ch=nb;m.i++;m.buf=''}
    return true;
  }
  if(m.buf&&u.c.includes(m.buf)){ // 「ん」を n ひとつで おわらせて つぎへ
    const keep=m.buf; u.ch=keep; m.i++; m.buf='';
    if(m.i<m.u.length&&press(m,k)) return true;
    m.i--; m.buf=keep; return false;
  }
  return false;
}
function isDone(m){return m.i>=m.u.length}
function guide(m){
  let typed='',rest='';
  m.u.forEach((u,j)=>{
    if(j<m.i) typed+=u.ch;
    else if(j===m.i){typed+=m.buf; const c=u.c.find(c=>c.startsWith(m.buf))||u.c[0]; rest+=c.slice(m.buf.length)}
    else rest+=u.c[0];
  });
  return {typed,rest};
}
function kanaDone(m){return m.u.slice(0,m.i).map(u=>u.k).join('')}

function keyPoint(combo,lv){return Math.round(5*Math.min(3,1+Math.floor(combo/25))*(LV_MUL[lv]||1))} // はやさより せいかくさ：1もじの てんは ひかえめ
function wordBonus(m,noMiss,lv){return Math.round((m.u.length*3+(noMiss?60:0))*(LV_MUL[lv]||1))} // ノーミスで うてると おおきい
const MISS_PENALTY=10;
const ACC_TIERS=[{min:100,name:'パーフェクト',mul:1,lv:4},{min:95,name:'ほぼ かんぺき',mul:.5,lv:3},{min:90,name:'すごい せいかくさ',mul:.25,lv:2},{min:80,name:'せいかくさ じょうず',mul:.1,lv:1}];
function accOf(ok,ng){return ok+ng?ok/(ok+ng)*100:0} // ひょうじは きりすて（ミスが あれば 100%に ならない）
function accBonus(score,ok,ng){ if(ok<40) return {tier:null,pt:0}; const a=accOf(ok,ng); const t=ACC_TIERS.find(t=>t.min===100?ng===0:a>=t.min); return t?{tier:t,pt:Math.round(score*t.mul)}:{tier:null,pt:0}}
function titleOf(score){let t=TITLES[0];for(const x of TITLES) if(score>=x[0]) t=x; return t}
function nextTitle(score){return TITLES.find(x=>x[0]>score)||null}
function coinsOf(score){return PLAY_BONUS+Math.floor(score/10)} // あそんだだけで すこし もらえる

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC}
function tone(f,d,type='square',v=.06,when=0){
  if(!S.sound) return; const a=ac(); if(!a) return;
  const t=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.02);
}
function slide(f1,f2,d,type='square',v=.05,when=0){
  if(!S.sound) return; const a=ac(); if(!a) return; const t=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.02);
}
function noise(d,v=.08,when=0,fc=2500){
  if(!S.sound) return; const a=ac(); if(!a) return; const n=Math.floor(a.sampleRate*d), b=a.createBuffer(1,n,a.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fc; const g=a.createGain(); g.gain.value=v;
  s.connect(f).connect(g).connect(a.destination); s.start(a.currentTime+when);
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const EASY_N=25;
function easyPool(){return WORDS.filter(w=>w.lv===1||(w.lv===2&&w.r.length<=4))} // かんたん：みじかい ことば

function sweep(d,v,f1,f2,q,pan0,pan1,when){
  if(!S.sound) return; const a=ac(); if(!a) return; const t=a.currentTime+(when||0), n=Math.floor(a.sampleRate*d), b=a.createBuffer(1,n,a.sampleRate), ch=b.getChannelData(0);

      if(r.t>=1){r.y=r.ty; burstAt(r); rockets.splice(i,1)}}
    for(let i=glows.length-1;i>=0;i--){const g=glows[i]; g.t+=dt; const k=g.t/.35; if(k>=1){glows.splice(i,1);continue}

  return new Promise(res=>{
    const o=document.createElement('div'); o.className='burst';
    o.innerHTML='<div class="fxhost"></div><div class="bt">🎆 おおあたり！ 🎆</div><div class="bc">'+cardHTML(w,isNew?'NEW!':'')+'</div><div class="bh">タップで つづける</div>';
    document.body.appendChild(o); const host=o.querySelector('.fxhost');
    SE.get(3); setTimeout(()=>SE.get(3),500);
    let fw=null; if(!REDUCE){fw=launchFireworks(host,{shells:5,gap:520,big:true,delay:200}); flyover(host,{count:1,dur:3.6,y:10,delay:.4})}
    let done=false; const fin=()=>{if(done)return;done=true;if(fw)fw.stop();o.remove();res()};
    o.addEventListener('click',fin); setTimeout(fin,4200);
  });
}
// --- せいかくさ ボーナス（80 / 90 / 95 / パーフェクト）---
function accFx(t){
  const o=document.createElement('div'); o.className='accfx l'+t.lv;
  o.innerHTML='<div class="fxhost"></div><div class="abanner">'+(t.lv===3?'🎆 ':'')+t.name+'！'+(t.lv===3?' 🎆':'')+'</div>';
  document.body.appendChild(o); const host=o.querySelector('.fxhost'); let fw=null;
  if(t.lv>=3){SE.get(3);setTimeout(()=>SE.get(3),450)}else SE.get(t.lv===2?2:1);
  if(!REDUCE){
    if(t.lv===1) fw=launchFireworks(host,{shells:1});
    else if(t.lv===2) fw=launchFireworks(host,{shells:2,gap:500});
    else if(t.lv===3) fw=launchFireworks(host,{shells:4,gap:480,big:true});
    else{ fw=launchFireworks(host,{shells:9,gap:430,big:true,delay:900}); flyover(host,{count:3,formation:true,dur:4.2,y:12}); setTimeout(()=>SE.get(3),900) }
  }
  const fin=()=>{if(fw)fw.stop();o.remove()}; o.addEventListener('click',fin); setTimeout(fin,[2400,3200,4000,6200][t.lv-1]);
}
function tileHTML(r,i,face){
  return face?`<button class="mini r${r.w.rar} flip ${r.isNew?'isnew':''}" data-bi="${i}"><div class="mi">${iconHTML(r.w)}</div><div class="mn">${esc(r.w.k)}</div><div class="nw">${r.isNew?'NEW!':'&nbsp;'}</div></button>`
    :`<div class="mini back" data-i="${i}"><div class="mi">❓</div><div class="mn">&nbsp;</div><div class="nw">&nbsp;</div></div>`;
}
async function reveal10(res,cm){
  skipRev=false; lastBatch=res;
  $('gres').innerHTML='<p class="center" id="revMsg" style="font-weight:700;margin-bottom:8px">ひらくよ…</p><div class="grid" id="revGrid">'+res.map((r,i)=>tileHTML(r,i,false)).join('')+'</div><div class="center" style="margin-top:8px"><button class="btn sub2 small" id="skipRev">ぜんぶ ひらく</button></div>';
  $('skipRev').onclick=()=>{skipRev=true};
  const grid=$('revGrid'); let nn=0;
  for(let i=0;i<res.length;i++){
    const r=res[i]; grid.children[i].outerHTML=tileHTML(r,i,true); if(r.isNew)nn++;
    const t=grid.children[i];
    if(r.w.rar===3&&r.isNew&&!skipRev){SE.get(3);await burst(r.w,true)}
    else{ if(r.isNew)SE.get(r.w.rar); else if(!skipRev)SE.flip(); if(r.isNew&&r.w.rar>=2)t.classList.add('shine') }
    $('revMsg').innerHTML='NEW <span style="color:var(--ng)">'+nn+'</span>まい！';
    if(!skipRev)await sleep(r.isNew?380:200);
  }
  const dup=res.length-nn;
  const rare=res.filter(r=>r.isNew&&r.w.rar===3).length;
  const bn=nn>=8?'🎊 すごい！ NEW '+nn+'まい！！ 🎊':nn>=5?'🎉 NEW '+nn+'まい！ やったね！':'';
  $('gres').insertAdjacentHTML('afterbegin',bn?'<div class="bigbanner">'+bn+'</div>':'');
  $('revMsg').innerHTML=res.length+'かい まわした！ <span style="color:var(--ng)">NEW '+nn+'まい</span>'+(dup?' ／ ダブり '+dup+'まい（<svg class="sj"><use href="#sjm"/></svg>+'+dup*DUP_BACK+'）':'')+(rare?' ／ ★3 '+rare+'まい！':'');
  if(nn>=5)SE.get(3);
  $('skipRev').parentNode.outerHTML='<p class="center" style="font-size:13px;color:var(--ink2);margin-top:6px">カードを タップすると おおきく みられるよ</p>'+cm;
}
async function doGacha(n){
  if(gBusy||S.coins<GACHA_COST*n) return; ac(); gBusy=true;
  const hadCert=certReady(); const res=[]; for(let i=0;i<n;i++)res.push(pull()); save();
  const best=res.reduce((a,r)=>r.w.rar>a.w.rar||(r.w.rar===a.w.rar&&r.isNew&&!a.isNew)?r:a,res[0]);
  $('coinG').textContent=S.coins; $('spinBtn').disabled=true; $('spin10Btn').disabled=true; $('gres').innerHTML='';
  const cap=$('capsule'); cap.style.background=['','var(--r1)','var(--r2)','var(--r3)'][best.w.rar]; cap.className='capsule spin'; SE.coin(); setTimeout(()=>SE.roll(),180);
  await sleep(900); cap.className='capsule open'; SE.pop();
  const cm=(!hadCert&&certReady())?certMsg():'';
  if(n===1){const {w,isNew}=res[0]; setTimeout(()=>SE.get(w.rar),150); if(!isNew)setTimeout(()=>SE.dup(),700);
    $('gres').innerHTML=cardHTML(w,isNew?'NEW!':'')+(isNew?'':'<p class="center" style="margin-top:8px">もっている カード！ ミルク缶が '+DUP_BACK+'こ もどってきたよ</p>')+cm;
  }else await reveal10(res,cm);
  gBusy=false; $('spinBtn').disabled=S.coins<GACHA_COST; $('spin10Btn').disabled=S.coins<GACHA_COST*10;
  setTimeout(()=>{cap.className='capsule';cap.style.background='var(--sun)'},500);
}
$('spinBtn').onclick=()=>doGacha(1);
$('spin10Btn').onclick=()=>doGacha(10);
$('gres').addEventListener('click',e=>{const b=e.target.closest('[data-bi]');if(!b)return;const r=lastBatch[b.dataset.bi];openModal(cardHTML(r.w,r.isNew?'NEW!':'')+'<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" onclick="closeModal()">とじる</button></div>')});

// ===== ずかん =====
function renderZukan(){
  const n=ownedCount(); $('zkCount').textContent=n+' / '+CARDS.length; $('zkBar').style.width=(n/CARDS.length*100)+'%';
  $('zkGrid').innerHTML=CATS.map(([c,label])=>{
    const L=CARDS.filter(w=>w.cat===c), got=L.filter(w=>S.cards[w.id]).length;
    if(!L.length) return '';
    return `<h3 class="zkh">${label}<span>${got} / ${L.length}${got===L.length?' ✅':''}</span></h3><div class="grid">`+
      L.map(w=>S.cards[w.id]
        ?`<button class="mini r${w.rar}" data-id="${w.id}"><div class="mi">${iconHTML(w)}</div><div class="mn">${esc(w.k)}</div></button>`
        :`<div class="mini no"><div class="mi">？</div><div class="mn">${'★'.repeat(w.rar)}</div></div>`).join('')+'</div>';
  }).join('');
}
$('zkReset').onclick=()=>{ac();SE.ui();openModal('<h3 style="margin:0 0 8px">ずかんを リセットする？</h3><p style="line-height:1.9;margin:0 0 12px">あつめた カードが <b>ぜんぶ きえて</b>、さいしょから あつめなおしに なるよ。<br>ミルク缶と ハイスコアは そのまま のこるよ。<br><b>もとには もどせないよ。</b></p><div class="row" style="justify-content:center;gap:12px"><button class="btn sub2" onclick="closeModal()">やめる</button><button class="btn danger" id="zkResetOk">リセットする</button></div>');
  $('zkResetOk').onclick=()=>{S.cards={};save();closeModal();renderZukan();renderTitle();SE.back()}};
$('zkGrid').addEventListener('click',e=>{const b=e.target.closest('[data-id]'); if(!b)return; const w=WORDS[b.dataset.id];
  openModal(cardHTML(w,'')+'<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" onclick="closeModal()">とじる</button></div>')});

// ===== しょうしょ =====
function renderCert(){ if(certReady()) setTimeout(()=>SE.cert(),250);
  const all=ownedCount()===CARDS.length, done=certReady(); $('nameIn').value=S.name||'';
  const d=new Date(), ds=d.getFullYear()+'ねん '+(d.getMonth()+1)+'がつ '+d.getDate()+'にち';
  const best=Math.max(S.best[1]||0,S.best[2]||0,S.best[3]||0);
  const body=all?`あなたは ふるさとカード ${CARDS.length}まいを<br>すべて あつめました。<br>牧場も、空港も、花火の夜空も、<br>あなたの ことばの なかに あります。<br>よって「<b>小美玉市 ふるさとマスター</b>」<br>であることを ここに しょうめいします。`
    :`あなたは 小美玉市の 町域 ${machiAll().length}こを<br>すべて あつめました。<br>牧場も、空港も、花火の夜空も、<br>あなたの ことばの なかに あります。<br>よって「<b>小美玉市マスター</b>」<br>であることを ここに しょうめいします。`;
  $('certBody').innerHTML=done?`<h3>しょうしょ</h3><div class="nm">${esc(S.name||'')}&nbsp;</div>
    <p>${body}</p>
    <p style="margin-top:10px">さいこう スコア ${best}てん ／ しょうごう「${titleOf(best)[1]}」</p>
    <p style="margin-top:12px;font-weight:700">つぎは、ほんものの 町へ でかけよう！</p>
    <div class="dt">${ds}　小美玉市 タイピング探検</div>`
    :`<h3 style="letter-spacing:.1em">まだだよ</h3><p>「町域」の カードを ぜんぶ あつめるか、<br>ふるさとカードを ぜんぶ あつめると<br>しょうしょが もらえるよ。（いま ${ownedCount()} / ${CARDS.length}）</p>`;
  $('printBtn').style.display=done?'':'none'; $('nameIn').style.display=done?'':'none';
}
$('nameIn').addEventListener('input',e=>{S.name=e.target.value;save();const nm=document.querySelector('.cert .nm');if(nm)nm.innerHTML=esc(S.name)+'&nbsp;'});
$('printBtn').onclick=()=>window.print();

renderTitle();
startAmbient();
</script>
